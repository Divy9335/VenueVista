spring.application.name=venuevista

# Use a project-local database file so other SQLite projects remain untouched.
spring.datasource.url=${DB_URL:jdbc:sqlite:./data/VenueVista.sqlite}
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Update creates missing tables on the first run; "none" requires a pre-created schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:venuevista-local-development-secret-change-before-deployment}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=8080
